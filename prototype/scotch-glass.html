<link rel="stylesheet" href="_ds/nocturne-ff3556a6-eb33-43c4-91f1-134ea1efe83f/styles.css">

<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #state {
    position: fixed; left: var(--space-6, 24px); bottom: var(--space-5, 18px); z-index: 5;
    display: flex; gap: var(--space-2, 8px); align-items: center;
  }
  #state .btn { letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }
  #state .btn[aria-pressed="true"] {
    border-color: var(--color-accent);
    background: color-mix(in oklch, var(--color-accent) 18%, transparent);
    color: var(--color-accent-200);
  }
  #meta {
    position: fixed; left: var(--space-6, 24px); top: var(--space-6, 24px); z-index: 5;
    color: var(--color-text);
  }
  #meta h1 { font-family: var(--font-heading); font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  #meta p { margin: 0; font-size: 12px; color: var(--color-neutral-400); max-width: 34ch; }
</style>

<body>
<three-d-stage name="ice-in-scotch" background="#161826"></three-d-stage>
<div id="meta">
  <h1>Ice Cube — on the rocks</h1>
  <p>One king cube in a cut-crystal glass of scotch. It turns slowly in the spirit and gives itself up to it when it melts.</p>
</div>
<div id="state">
  <button class="btn btn-secondary" data-mode="idle" aria-pressed="true">idle</button>
  <button class="btn btn-secondary" data-mode="listening" aria-pressed="false">listening</button>
  <button class="btn btn-secondary" data-mode="thinking" aria-pressed="false">thinking</button>
  <button class="btn btn-secondary" data-mode="speaking" aria-pressed="false">speaking</button>
  <button class="btn btn-secondary" data-mode="melting" aria-pressed="false">melting</button>
</div>
<script src="./three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

/* cold studio environment: bright sky, dark floor, two specular sources —
   ice needs something to refract or it renders as grey glass */
try {
  const c = document.createElement('canvas');
  c.width = 96; c.height = 48;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 48);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.4, '#dceaff');
  g.addColorStop(0.55, '#5c6b85'); g.addColorStop(1, '#141824');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 96, 48);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.ellipse(26, 10, 14, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(64, 6, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(190,225,255,0.95)';
  ctx.beginPath(); ctx.ellipse(78, 20, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(0, 22, 96, 2);
  const tex = new THREE.Texture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.needsUpdate = true;
  const pmrem = new THREE.PMREMGenerator(stage._renderer);
  stage._scene.environment = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
} catch (e) { /* environment is a nicety */ }

const cube = new THREE.Group();
cube.name = 'ice_cube';

const R = 0.5;                       // half-extent, metres
const iceColors = ['#dff1ff', '#c8e8ff', '#cfd8ff', '#d8f6ff'].map(h => new THREE.Color(h));
const tintAt = (t, out) => {
  const f = ((t % iceColors.length) + iceColors.length) % iceColors.length;
  const i = Math.floor(f);
  return out.copy(iceColors[i]).lerp(iceColors[(i + 1) % iceColors.length], f - i);
};

const iceMat = new THREE.MeshPhysicalMaterial({
  name: 'ice',
  color: new THREE.Color('#eef8ff'),
  transparent: true,
  opacity: 0.99,
  transmission: 0.88,
  thickness: 0.6,
  envMapIntensity: 3.2,
  specularIntensity: 1,
  specularColor: new THREE.Color('#ffffff'),
  ior: 1.31,
  roughness: 0.045,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.015,
  iridescence: 0.05,
  iridescenceIOR: 1.31,
  attenuationDistance: 1.15,
  attenuationColor: new THREE.Color('#a6dcff'),
  sheen: 0,
});

const iceGeo = new THREE.SphereGeometry(1, 128, 88);
const ice = new THREE.Mesh(iceGeo, iceMat);
ice.name = 'block';
cube.add(ice);
const dirs = iceGeo.attributes.position.array.slice();   // unit sphere directions
/* frozen-in facet irregularity: fixed per vertex, so the surface never breathes */
const chip = new Float32Array(dirs.length / 3);
for (let i = 0, j = 0; i < dirs.length; i += 3, j++) {
  const x = dirs[i], y = dirs[i + 1], z = dirs[i + 2];
  chip[j] =
    Math.sin(x * 6.1 + y * 4.3 - z * 5.7) * 0.5 +
    Math.sin(y * 9.4 - z * 7.9 + x * 3.1) * 0.3 +
    Math.sin(z * 13.7 + x * 11.2) * 0.2;
}

/* frost rim — fresnel bloom bound to the block's own geometry */
const rimMat = new THREE.ShaderMaterial({
  name: 'frost_rim',
  uniforms: { uColor: { value: new THREE.Color('#bfe6ff') }, uStrength: { value: 0.5 } },
  vertexShader: `
    varying vec3 vN; varying vec3 vP;
    void main() {
      vN = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position * 1.03, 1.0);
      vP = mv.xyz;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uColor; uniform float uStrength;
    varying vec3 vN; varying vec3 vP;
    void main() {
      float f = 1.0 - abs(dot(normalize(vN), normalize(-vP)));
      float a = pow(f, 2.4) * (1.0 - pow(f, 9.0)) * uStrength;
      gl_FragColor = vec4(uColor * a, a);
    }`,
  transparent: true, blending: THREE.AdditiveBlending, depthWrite: false,
});
const rim = new THREE.Mesh(iceGeo, rimMat);
rim.name = 'frost_rim';
cube.add(rim);

/* frozen core — the "attention" the avatar carries, a cloudy crystal */
const coreMat = new THREE.MeshStandardMaterial({
  name: 'core',
  color: new THREE.Color('#cfeaff'),
  emissive: new THREE.Color('#8fd8ff'),
  emissiveIntensity: 1.6,
  roughness: 0.95,
  metalness: 0,
  flatShading: true,
  transparent: true,
  opacity: 0.4,
});
const coreGeo = new THREE.OctahedronGeometry(0.21, 1);
const core = new THREE.Mesh(coreGeo, coreMat);
core.name = 'core';
cube.add(core);
const coreBase = coreGeo.attributes.position.array.slice();

/* trapped air bubbles */
const bubbleMat = new THREE.MeshPhysicalMaterial({
  name: 'air_bubble',
  color: new THREE.Color('#f4fdff'),
  roughness: 0.04, metalness: 0,
  transmission: 0.95, thickness: 0.06, ior: 1.05,
  transparent: true, opacity: 0.45,
});
const bubbles = [];
for (let i = 0; i < 9; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.016 + (i % 4) * 0.012, 18, 12), bubbleMat);
  b.name = 'air_bubble_' + (i + 1);
  const a = i * 2.399963, rr = 0.13 + (i % 4) * 0.07;
  b.userData.orbit = { a, rr, y: -0.22 + i * 0.055, sp: 0.12 + (i % 3) * 0.07 };
  b.castShadow = false; b.receiveShadow = false;
  bubbles.push(b); cube.add(b);
}

const MODES = {
  //          sharp = rounded-cube exponent · shimmer = surface ripple · melt target
  idle:      { sharp: 12,  shimmer: 0.4, speed: 0.8, spin: 0.06, glow: 1.6, halo: 0.3,  tint: 0.015, melt: 0, bob: 0.010,
               swirl: 0.045, swirlSpeed: 0.14, gap: 4.2, amp: 0.055, spin2: 0.5, kick: 0.16, rise: 0 },
  listening: { sharp: 17,  shimmer: 0.6, speed: 1.4, spin: 0.03, glow: 2.6, halo: 0.5,  tint: 0.03,  melt: 0, bob: 0.014,
               swirl: 0.028, swirlSpeed: 0.08, gap: 2.4, amp: 0.022, spin2: 0.22, kick: 0.08, rise: 0.055 },
  thinking:  { sharp: 9,   shimmer: 0.8, speed: 2.4, spin: 0.45, glow: 2.2, halo: 0.42, tint: 0.16,  melt: 0, bob: 0.026,
               swirl: 0.10,  swirlSpeed: 1.15, gap: 1.0, amp: 0.05,  spin2: 1.7, kick: 0.9,  rise: 0.02 },
  speaking:  { sharp: 13,  shimmer: 1.0, speed: 3.2, spin: 0.09, glow: 3.2, halo: 0.6,  tint: 0.06,  melt: 0, bob: 0.040,
               swirl: 0.06,  swirlSpeed: 0.3,  gap: 0.3, amp: 0.115, spin2: 1.0, kick: 0.28, rise: 0.03 },
  melting:   { sharp: 4.2, shimmer: 1.4, speed: 1.0, spin: 0.02, glow: 1.0, halo: 0.2,  tint: 0.03,  melt: 1, bob: 0.003,
               swirl: 0.0,   swirlSpeed: 0.05, gap: 6.0, amp: 0.0,   spin2: 0.05, kick: 0.0, rise: 0 },
};
let mode = MODES.idle, m = { ...MODES.idle };
let modeName = 'idle';

const buttons = [...document.querySelectorAll('#state button')];
buttons.forEach(btn => btn.addEventListener('click', () => {
  buttons.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  modeName = btn.dataset.mode;
  mode = MODES[modeName];
}));

const smooth = x => x * x * (3 - 2 * x);
/* bob / tilt / swirl are sprung, and each mode kicks them on its own cadence:
   listening barely stirs, thinking swirls the cube round the glass, speaking
   bobs on the beat */
let py = 0, vy = 0, rx = 0, vrx = 0, rz = 0, vrz = 0, swirlA = Math.random() * 6.28, swirlV = 0, pulseT = 0.4;
const FLOOR_Y = 0.368, RIM_Y = 1.50, INNER_R = 0.555;   // the glass interior, in world units
/* dilution tracks the melt: the pour rises and pales, and comes back neat */
let dilute = 0;
const SCOTCH_NEAT = new THREE.Color('#b8681c'), SCOTCH_CUT = new THREE.Color('#d9a969');
const scotchTint = new THREE.Color();
const v = new THREE.Vector3();
const tint = new THREE.Color();
const clock = new THREE.Clock();
let phase = 0, drift = 0, t = 0;

const tickFrame = () => {
  const dt = Math.min(clock.getDelta(), 0.05);
  t += dt;
  for (const k in m) m[k] += (mode[k] - m[k]) * Math.min(1, dt * (k === 'melt' ? 0.9 : 3));
  phase += dt * m.speed;
  drift += dt * m.tint;

  const melt = m.melt;

  const sharp = m.sharp - melt * (m.sharp - 4) * 0.75;                 // edges round off as it goes
  const glisten = m.shimmer * melt;
  const e = smooth(melt);                             // eased melt
  const RP = R * 1.75, HH = R * 0.105;                // pool radius / depth
  const pos = iceGeo.attributes.position, arr = pos.array;

  for (let i = 0; i < arr.length; i += 3) {
    const dx = dirs[i], dy = dirs[i + 1], dz = dirs[i + 2];
    // unit sphere -> rounded cube (superellipsoid), exponent = edge sharpness
    const r = 1 / Math.pow(
      Math.pow(Math.abs(dx), sharp) + Math.pow(Math.abs(dy), sharp) + Math.pow(Math.abs(dz), sharp),
      1 / sharp);
    let x = dx * r * R, y = dy * r * R, z = dz * r * R;

    // frozen facet irregularity — static, plus a faint surface glisten near melt
    const rp = 1 + chip[i / 3] * 0.011 * (1 - e) + glisten * 0.0015 * Math.sin(dy * 30 + phase * 3.0);
    x *= rp; y *= rp; z *= rp;

    // dished top, the way a tray cube freezes
    y -= Math.max(0, dy) * 0.05 * R * (1 - melt) * (1 - (x * x + z * z) / (R * R));

    if (e > 0.001) {
      // target shape: a rounded pancake of water resting on the base plane
      const rho = Math.hypot(dx, dz);
      const d = Math.pow(Math.pow(rho, 4) + Math.pow(Math.abs(dy), 4), 0.25) || 1;
      const wob = 1 + 0.05 * Math.sin(Math.atan2(dz, dx) * 5 + phase * 0.8);
      const tx = (dx / d) * RP * wob, tz = (dz / d) * RP * wob;
      const ty = (dy / d) * HH - R + HH;
      x += (tx - x) * e; y += (ty - y) * e; z += (tz - z) * e;
    }
    arr[i] = x; arr[i + 1] = y; arr[i + 2] = z;
  }
  pos.needsUpdate = true;
  iceGeo.computeVertexNormals();

  /* core: shivers, sinks and dims as the block gives way */
  const cpos = coreGeo.attributes.position, ca = cpos.array;
  const jitter = 0.006 * (1 + m.shimmer);
  for (let i = 0; i < ca.length; i += 3) {
    v.set(coreBase[i], coreBase[i + 1], coreBase[i + 2]);
    const s = 1 + jitter * Math.sin(v.x * 21 + v.y * 13 - phase * 3.1);
    ca[i] = v.x * s; ca[i + 1] = v.y * s; ca[i + 2] = v.z * s;
  }
  cpos.needsUpdate = true;
  coreGeo.computeVertexNormals();

  tintAt(drift, tint);
  iceMat.color.copy(tint);
  iceMat.roughness = 0.14 + melt * 0.06;
  const gone = Math.max(0, (e - 0.72) / 0.28);           // the last of it dissolves away
  iceMat.opacity = 0.99 * (1 - gone * 0.92);
  scotchTint.copy(SCOTCH_NEAT).lerp(SCOTCH_CUT, 0.6);
  ice.visible = gone < 0.99; rim.visible = ice.visible;
  iceMat.attenuationColor.copy(tint).lerp(new THREE.Color('#7fc4ff'), 0.55).lerp(scotchTint, gone * 0.8);
  coreMat.emissive.copy(tint).lerp(new THREE.Color('#6fd2ff'), 0.6);
  coreMat.emissiveIntensity = m.glow * (1 - e) * (0.9 + Math.sin(phase * 2.3) * 0.1);
  coreMat.opacity = 0.4 * Math.max(0, 1 - e * 1.6);      // the heart thaws away entirely
  core.visible = coreMat.opacity > 0.005;
  rimMat.uniforms.uColor.value.copy(tint);
  rimMat.uniforms.uStrength.value = m.halo * 1.1 * (1 - melt * 0.7) * (0.85 + Math.sin(phase * 1.9) * 0.15);

  core.scale.setScalar(1 - e * 0.62);
  core.position.set(Math.sin(phase * 0.6) * 0.02 * (1 - e),
    (Math.sin(phase * 0.8) * 0.015) * (1 - e) + e * (-R + 0.055),
    Math.cos(phase * 0.5) * 0.02 * (1 - e));
  core.rotation.set(phase * 0.12, phase * 0.21, 0);

  bubbles.forEach((b, i) => {
    const o = b.userData.orbit, a = o.a + phase * o.sp;
    const rr = o.rr * (1 + e * 1.1);
    const fy = o.y + Math.sin(phase * 0.7 + o.a) * 0.03;
    b.position.set(Math.cos(a) * rr, fy + (-R + 0.045 - fy) * e, Math.sin(a) * rr);
    b.scale.setScalar(1 - e * 0.5);
    bubbleMat.opacity = 0.45 * Math.max(0, 1 - e * 1.5);
    b.visible = bubbleMat.opacity > 0.005;
  });

  const lift = 1 - e;
  const s = 0.58 * (1 - e * 0.55);
  const rigY = Math.max(FLOOR_Y + R * s, (WATER_TOP - 0.20) - e * 0.29);

  pulseT -= dt;
  if (pulseT <= 0 && lift > 0.05) {
    pulseT = m.gap * (0.55 + Math.random() * 0.9);
    vy += m.amp * (0.6 + Math.random() * 0.8) * 6;
    vrx += (Math.random() - 0.5) * m.spin2;
    vrz += (Math.random() - 0.5) * m.spin2;
    swirlV += (Math.random() - 0.5) * m.kick;
  }
  vy += (-py * 46 - vy * 4.4) * dt; py += vy * dt;
  vrx += (-rx * 16 - vrx * 2.6) * dt; rx += vrx * dt;
  vrz += (-rz * 16 - vrz * 2.6) * dt; rz += vrz * dt;
  swirlV *= 1 - Math.min(1, dt * 1.4);
  swirlA += (m.swirlSpeed + swirlV) * dt;

  const w = m.bob * 1.6 * lift, sw = m.swirl * lift;
  cube.position.set(
    Math.cos(swirlA) * sw + Math.sin(t * 0.37) * w,
    py * lift + m.rise * lift,
    Math.sin(swirlA) * sw + Math.cos(t * 0.43 + 2.1) * w);
  cube.rotation.x = (rx + Math.sin(t * 0.31) * 0.05) * lift;
  cube.rotation.z = (rz + Math.cos(t * 0.27 + 1.9) * 0.05) * lift;

  /* containment — the cube is inside a glass, so clamp its local offset to what
     the interior can hold (half-diagonal of the block, plus tilt slop) */
  const halfDiag = R * Math.SQRT2 * 1.06;
  const room = Math.max(0, (INNER_R / s) - halfDiag);
  const off = Math.hypot(cube.position.x, cube.position.z);
  if (off > room && off > 1e-6) {
    cube.position.x *= room / off;
    cube.position.z *= room / off;
    swirlV *= 0.3;
  }
  const lowLocal = (FLOOR_Y - rigY) / s + halfDiag * 0.72;   // block corner may dip
  if (cube.position.y < lowLocal) { cube.position.y = lowLocal; if (vy < 0) vy = -vy * 0.35; }
  const highLocal = (RIM_Y - rigY) / s - R * 1.1;
  if (cube.position.y > highLocal) { cube.position.y = highLocal; if (vy > 0) vy = -vy * 0.3; }

  /* it floats a little lower and smaller as it gives itself up to the water */
  /* keep the cube — and the pool it melts into — resting above the glass floor */
  rig.scale.setScalar(s);
  rig.position.y = rigY;

  dilute += (e - dilute) * Math.min(1, dt * 1.1);
  const dl = smooth(dilute);
  water.scale.y = 1 + dl * 0.075;                        // level creeps up as it thaws
  water.position.y = -0.358 * dl * 0.075;
  waterMat.color.copy(SCOTCH_NEAT).lerp(SCOTCH_CUT, dl * 0.75);
  waterMat.opacity = 0.62 - dl * 0.14;
  waterMat.emissiveIntensity = 0.5 - dl * 0.22;
  waterMat.roughness = 0.05 + dl * 0.02;

  /* surface ripple, strongest right around the cube */
  const wpos = waterGeo.attributes.position, wa = wpos.array;
  for (let i = 0; i < wa.length; i += 3) {
    const by = waterBase[i + 1];
    if (by < waterTopY - 0.0005) { wa[i + 1] = by; continue; }
    const bx = waterBase[i], bz = waterBase[i + 2];
    const rr = Math.hypot(bx, bz);
    wa[i + 1] = by
      + Math.sin(rr * 16 - t * 1.5 - swirlA) * 0.005 * (0.35 + Math.abs(vy) * 1.6 + m.bob * 10)
      + Math.sin(bx * 6 + t * 0.8) * 0.003;
  }
  wpos.needsUpdate = true;
  waterGeo.computeVertexNormals();
  cube.rotation.y += dt * m.spin * (1 - e * 0.8);
};

/* ---- tumbler: single lathe profile, outside wall over the rim and back down ---- */
const glassMat = new THREE.MeshPhysicalMaterial({
  name: 'glass',
  color: new THREE.Color('#dfeaf7'),
  transparent: true,
  opacity: 0.17,
  transmission: 0,
  envMapIntensity: 3.4,
  ior: 1.5,
  roughness: 0.015,
  metalness: 0,
  clearcoat: 1,
  clearcoatRoughness: 0.01,
  side: THREE.DoubleSide,
  depthWrite: false,
});
const GP = [
  [0.620, 0.000], [0.656, 0.050], [0.670, 0.600], [0.681, 1.400],
  [0.6825, 1.500], [0.6805, 1.545], [0.6745, 1.573], [0.6655, 1.585],
  [0.6565, 1.578], [0.6505, 1.556], [0.6485, 1.520],
  [0.646, 1.460], [0.630, 0.640], [0.560, 0.420], [0.440, 0.355],
].map(p => new THREE.Vector2(p[0], p[1]));
const glassGeo = new THREE.LatheGeometry(GP, 192);
/* cut-crystal flutes on the outside wall — a slow radial modulation */
{
  const gp = glassGeo.attributes.position, ga = gp.array;
  for (let i = 0; i < ga.length; i += 3) {
    const x = ga[i], z = ga[i + 2], y = ga[i + 1];
    const rr = Math.hypot(x, z);
    if (rr < 0.64 || y < 0.06) continue;                // outer wall only
    const th = Math.atan2(z, x);
    const cut = 1 - 0.022 * Math.pow(Math.abs(Math.cos(th * 8)), 0.7)
      * Math.min(1, (y - 0.05) / 0.25) * Math.min(1, Math.max(0, (1.42 - y) / 0.18));
    ga[i] = x * cut; ga[i + 2] = z * cut;
  }
  gp.needsUpdate = true;
  glassGeo.computeVertexNormals();
}
const glass = new THREE.Mesh(glassGeo, glassMat);
glass.name = 'crystal_glass';
/* flat caps instead of a pinched lathe centre (which shaded as radial streaks) */
const baseUnder = new THREE.Mesh(new THREE.CircleGeometry(0.620, 96), glassMat);
baseUnder.name = 'base_underside';
baseUnder.rotation.x = Math.PI / 2;
baseUnder.position.y = 0.0005;
const baseFloor = new THREE.Mesh(new THREE.CircleGeometry(0.440, 96), glassMat);
baseFloor.name = 'base_floor';
baseFloor.rotation.x = -Math.PI / 2;
baseFloor.position.y = 0.3555;
glass.add(baseUnder, baseFloor);
glass.castShadow = true; glass.receiveShadow = false;

/* ---- water body: a cylinder with a lightly disturbed surface ---- */
const waterMat = new THREE.MeshPhysicalMaterial({
  name: 'scotch',
  color: new THREE.Color('#b8681c'),
  transparent: true,
  opacity: 0.62,
  transmission: 0,
  envMapIntensity: 1.4,
  roughness: 0.05,
  metalness: 0,
  clearcoat: 0.6,
  clearcoatRoughness: 0.04,
  emissive: new THREE.Color('#41190a'),
  emissiveIntensity: 0.5,
  side: THREE.DoubleSide,
  depthWrite: true,
});
const WATER_TOP = 1.0;
/* the pour takes the glass's own interior profile, so it sits in the bowl exactly */
const INNER = [[0.442, 0.358], [0.500, 0.395], [0.558, 0.425], [0.600, 0.520], [0.630, 0.640], [0.638, 1.100], [0.646, 1.460]];
const innerR = y => {
  if (y <= INNER[0][1]) return INNER[0][0];
  for (let i = 1; i < INNER.length; i++) {
    if (y <= INNER[i][1]) {
      const [r0, y0] = INNER[i - 1], [r1, y1] = INNER[i];
      return r0 + (r1 - r0) * (y - y0) / (y1 - y0);
    }
  }
  return INNER[INNER.length - 1][0];
};
const WP = [new THREE.Vector2(0.0015, 0.358)];
for (let i = 0; i <= 20; i++) {
  const y = 0.358 + (WATER_TOP - 0.358) * (i / 20);
  WP.push(new THREE.Vector2(innerR(y) - 0.006, y));
}
WP.push(new THREE.Vector2(0.0015, WATER_TOP));
const waterGeo = new THREE.LatheGeometry(WP, 96);
const water = new THREE.Mesh(waterGeo, waterMat);
water.name = 'scotch';
water.castShadow = false; water.receiveShadow = false;
water.renderOrder = 0;
cube.traverse(o => { if (o.isMesh) o.renderOrder = 1; });
glass.renderOrder = 2;
const waterBase = waterGeo.attributes.position.array.slice();
const waterTopY = WATER_TOP;

/* the cube rides in its own rig so its drift stays local */
const rig = new THREE.Group();
rig.name = 'float_rig';
rig.scale.setScalar(0.58);
rig.position.y = WATER_TOP - 0.20;
rig.add(cube);

const set = new THREE.Group();
set.name = 'ice_in_glass';
set.add(glass, water, rig);
stage.setObject(set);
/* own rAF loop: onBeforeRender dies the moment its host mesh is hidden */
(function frame() { requestAnimationFrame(frame); tickFrame(); })();
rim.castShadow = false; rim.receiveShadow = false;
</script>
</body>
</html>
